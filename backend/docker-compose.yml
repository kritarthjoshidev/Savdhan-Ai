version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: surveillance_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: surveillance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for pub/sub and caching)
  redis:
    image: redis:7-alpine
    container_name: surveillance_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: surveillance_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow (model registry & experiment tracking)
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: surveillance_mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://postgres:postgres_password@postgres:5432/mlflow --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    environment:
      BACKEND_STORE_URI: postgresql://postgres:postgres_password@postgres:5432/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: surveillance_backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/surveillance_db
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: surveillance
      STORAGE_BACKEND: minio
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DEBUG: "False"
    volumes:
      - ./app:/app/app
      - ./:/app
    restart: unless-stopped

  # Celery Worker (for async training tasks)
  celery_worker:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: surveillance_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/surveillance_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_BUCKET: surveillance
      STORAGE_BACKEND: minio
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./app:/app/app
      - ./:/app
    restart: unless-stopped

  # Celery Beat (for scheduled tasks)
  celery_beat:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: surveillance_celery_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ./:/app
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  mlflow_artifacts:

networks:
  default:
    name: surveillance_network
